<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Popular Desserts</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
  <!-- Header Section -->
  <header>
    <div class="container-fluid bg-primary text-white mb-4">
      <div class="col-sm-8 mx-auto text-center py-4">
        <h1 class="display-3">Popular Desserts List</h1>
        <p class="lead">Informative web page on Popular Desserts from around the world</p>
      </div>
    </div>
  </header>

  <!-- Main Content Section -->
  <main>
    <div class="container">
      <h2>Popular Desserts</h2>
      <p>This is a simple web page showcasing some popular desserts from around the world.</p>

      <!-- Two-column grid layout -->
      <div class="row g-4">

        <!-- Left Column: Desserts List -->
        <div class="col-lg-6">
          <div class="card">
            <div class="card-header bg-primary-subtle">
              <h5 class="mb-0">Desserts List</h5>
            </div>
            <div class="card-body" id="dessertsList">
              <em>List is empty</em>
            </div>
          </div>
          <!-- Action Buttons -->
          <button type="button" class="btn btn-primary mt-4" onclick="buildDessertsList()">Display Popular Desserts</button>
          <button type="button" class="btn btn-danger mt-4" onclick="clearDesserts()">Clear All Desserts</button>
        </div>

        <!-- Right Column: Add Dessert Form -->
        <div class="col-lg-6">
          <div class="card">
            <div class="card-header bg-primary-subtle">
              <h5 class="mb-0">Add New Dessert</h5>
            </div>
            <div class="card-body">
              <form id="addDessertForm">
                <div class="mb-3">
                  <label for="dessertInput" class="form-label">Dessert Name</label>
                  <input type="text" class="form-control" id="dessertInput" placeholder="Enter dessert name" required>
                </div>
                <button type="submit" class="btn btn-primary">Add Dessert</button>
                <div id="errorMessage" class="text-danger mt-2"></div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer Section -->
  <footer>
    <div class="container-fluid bg-secondary-subtle mt-5">
      <div class="col-sm-8 mx-auto text-center py-2">
        <p class="small mb-0">Copyright &copy; 2026. All rights reserved.</p>
      </div>
    </div>
  </footer>

  <script>
    // Get references to form elements
    const addDessertForm = document.getElementById("addDessertForm");
    const statusDiv = document.getElementById("status");
    const dessertInput = document.getElementById("dessertInput");

   
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
</body>

</html>
